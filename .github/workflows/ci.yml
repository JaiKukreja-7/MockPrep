name: CI

on:
  push:
    branches: [main]
  pull_request:

# Three jobs, three costs. `unit` needs nothing and also runs inside the
# production build via `npm run build`. The other two need the Supabase
# project: add NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY as
# repository secrets. Without them those jobs fail, by design — a check that
# silently skips is a check that has stopped checking. E2E_EMAIL and
# E2E_PASSWORD are optional: with them the audit also covers the screens
# that only exist with data (a scored report, a resume analysis, a session).

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `next typegen` first: PageProps and LayoutProps are generated into
      # .next/types, so a bare tsc on a fresh checkout fails on every page.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  design-audit:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds first, then serves the build and audits every route at three widths.
      - run: npm run test:e2e
